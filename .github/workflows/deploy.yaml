name: Deploy the Nest.js app to the Render

'on':
  push:
    branches:
      - main

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependency
        run: npm ci

      - name: Create Build
        run: npm run build

      - name: Deploy To Render
        run: curl --fail --silent --show-error "${{secrets.RENDER_DEPLOY_HOOK_URL}}"
